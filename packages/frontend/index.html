<!doctype html>
<!--
  Armenian, matching the default the app boots with. The inline script below
  restamps it from the saved preference, but a crawler reads the attribute as
  served — and declaring Russian over Armenian content tells a search engine to
  index it against the wrong language.
-->
<html lang="hy">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MatyanAI — ՀՀ հարկային և աշխատանքային օրենսդրության տեղեկատու</title>

    <!--
      What a search result and a shared link actually show.

      Written in Armenian because that is who searches for this: an accountant
      in Yerevan looking for "հարկային օրենսգիրք" is the audience, and a
      description in English would be indexed against words nobody types.

      The title carries the subject rather than only the brand. Nobody is
      searching for "MatyanAI" yet — the name has to be found through what it
      does before it can be found by name.
    -->
    <meta
      name="description"
      content="ՀՀ հարկային և աշխատանքային օրենսդրության տեղեկատու։ Պատասխանները հենվում են օրենքի իրական տեքստի վրա՝ հոդվածների ուղիղ հղումներով։ Ոչ իրավաբանական խորհրդատվություն։"
    />
    <link rel="canonical" href="https://matyanai.am/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MatyanAI" />
    <meta property="og:url" content="https://matyanai.am/" />
    <meta
      property="og:title"
      content="MatyanAI — ՀՀ հարկային և աշխատանքային օրենսդրության տեղեկատու"
    />
    <meta
      property="og:description"
      content="Տվեք հարկային կամ աշխատանքային հարց։ Պատասխանը հենվում է ՀՀ օրենսդրության իրական տեքստի վրա։"
    />
    <meta name="twitter:card" content="summary" />
    <!--
      Prata sets display, Lora sets body, Noto Serif Armenian sets statute.
      Preconnect because the first paint depends on them: this design is
      typographic, and a fallback-metric flash is the whole page moving.
      Sylfaen stays in the CSS stack behind Noto — it ships with Windows and
      covers Armenian, so a blocked font request still never renders tofu.
    -->
    <!--
      Fetched at idle priority, not on demand. It is only needed once a question
      is asked, but fetching it THEN would race the answer it exists to cover —
      the first questioner could watch nothing at all while it downloads.
      `prefetch` rather than `preload` so it never competes with the fonts and
      the bundle, which the first paint actually depends on.
    -->
    <!--
      SVG only. Every browser this app supports reads an SVG favicon, and one
      vector file stays sharp at 16px in the tab and at 180px on a home
      screen — where a single .ico would be soft at one end or heavy at the
      other. theme-color paints the mobile browser chrome to match the page
      ground instead of leaving a white band above a cream design.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#EDE8DC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#33191E" media="(prefers-color-scheme: dark)" />
    <link rel="prefetch" as="image" href="/thinking.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Prata&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,600&family=Noto+Serif+Armenian:wght@400;600;700&display=swap"
    />
    <script>
      /*
       * Stamp the saved theme and language BEFORE the app boots.
       *
       * React applies both on mount, which is one paint too late: a dark-mode
       * user gets a white flash on every load, and the page briefly announces
       * the wrong language to assistive technology. Reading localStorage here
       * costs nothing and removes both.
       *
       * Wrapped in try/catch because localStorage throws outright when cookies
       * are blocked, and a theme preference must never stop the app loading.
       */
      try {
        var t = localStorage.getItem('armlex.theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
        var l = localStorage.getItem('armlex.lang');
        if (l === 'hy' || l === 'ru' || l === 'en') document.documentElement.lang = l;
      } catch (e) {
        /* no stored preference is available; the defaults are fine */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
